[package]
name = "saki"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"

[lib]
name = "saki"
crate-type = ["cdylib"]

[dependencies]
# pyo3 = { version = "0.21.2" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }

# parser-generator
pest = "2"
pest_derive = "2"

# common stuff
uuid = { version = "1.23.1", features = ["serde", "fast-rng", "v4"] }
rand = "0.10.1"
num_cpus = "1.0"

# json
serde = { version = "1", features = ["derive", "serde_derive", "alloc"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde-big-array = "0.5"

# singleton (like used for the config-variable)
once_cell = "1.18"
# threading
core_affinity = "0.8.3"
# common stuff
lazy_static = "1.4"
futures = "0.3"
bytes = "1"
byteorder = "1.5"
bincode = { version = "2.0", features = ["serde"] }
bytemuck = "1.25"

[dev-dependencies]
serial_test = "3"
